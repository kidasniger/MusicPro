name: Build & Release APK

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

concurrency:
  group: musicpro-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Run unit tests
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon -Djava.awt.headless=true

      - name: Run lint
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug --no-daemon -Djava.awt.headless=true

      - name: Decode Keystore from Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-upload-key.jks

      - name: Extract Version Info
        id: version_info
        run: |
          BASE_VERSION=$(grep 'releaseVersionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d ' ')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d ' ')
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0"
          fi
          VERSION_NAME="$BASE_VERSION-b${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          TAG_NAME="v$VERSION_NAME"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare Release Notes
        id: release_notes
        shell: bash
        run: |
          # Le corps du commit courant est utilisé comme résumé utilisateur.
          # Il doit contenir uniquement les changements visibles ou utiles dans l'application.
          NOTES=$(git log -1 --pretty=format:'%b' | sed '/^[[:space:]]*$/d')
          if [ -z "$NOTES" ]; then
            NOTES=$(git log -1 --pretty=format:'%s')
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build & Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PversionName=${{ steps.version_info.outputs.version_name }} -PversionCode=${{ steps.version_info.outputs.version_code }} --no-daemon -Djava.awt.headless=true

      - name: Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/*.apk "build_output/MusicPro-${{ steps.version_info.outputs.tag_name }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build_output/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Release ${{ steps.version_info.outputs.tag_name }} (v${{ steps.version_info.outputs.version_name }})"
          body: |
            ### Mise à jour MusicPro
            ${{ steps.release_notes.outputs.notes }}
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "### Build + APK + Release + Tag terminés automatiquement" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fichier: MusicPro-${{ steps.version_info.outputs.tag_name }}.apk" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: ${{ steps.version_info.outputs.version_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: ${{ steps.version_info.outputs.tag_name }}" >> "$GITHUB_STEP_SUMMARY"
