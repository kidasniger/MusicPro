name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true


      - name: Decode Keystore from Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-upload-key.jks

      - name: Extract Version Info
        id: version_info
        run: |
          BASE_VERSION=$(grep 'releaseVersionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d ' ')
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d ' ')
          fi
          if [ -z "$BASE_VERSION" ]; then
            BASE_VERSION="1.0"
          fi
          # Version Name complet qui apparaîtra dans les paramètres Android du téléphone (ex: 1.0-b12)
          VERSION_NAME="${BASE_VERSION}-b${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"
          TAG_NAME="v${VERSION_NAME}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest --no-daemon -Djava.awt.headless=true

      - name: Run lint
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          chmod +x ./gradlew
          ./gradlew :app:lintDebug --no-daemon -Djava.awt.headless=true
      - name: Build & Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease -PversionName=${{ steps.version_info.outputs.version_name }} -PversionCode=${{ steps.version_info.outputs.version_code }} --no-daemon -Djava.awt.headless=true

      - name: Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/*.apk build_output/MusicPro-${{ steps.version_info.outputs.tag_name }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build_output/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Release ${{ steps.version_info.outputs.tag_name }} (v${{ steps.version_info.outputs.version_name }})"
          body: |
            ### Nouveautés et correctifs :
            - ${{ github.event.head_commit.message || 'Améliorations des performances et corrections de bugs.' }}
            - Optimisation de la stabilité audio et de la lecture
            - Mise à jour de l'interface et corrections générales
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

