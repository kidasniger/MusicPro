name: Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true


      - name: Decode Keystore from Secret
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-upload-key.jks

      - name: Setup .env file
        run: |
          touch .env
          if [ -n "${{ secrets.GROQ_API_KEY }}" ]; then
            echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          fi

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/' | tr -d ' ')
          VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -n 1 | grep -o '[0-9]\+' | head -n 1)
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0"
          fi
          # Création d'un tag unique avec le run_number pour éviter les conflits
          TAG_NAME="v${VERSION_NAME}-b${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Build & Sign Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Rename APK
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/*.apk build_output/MusicPro-${{ steps.version_info.outputs.tag_name }}.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-signed
          path: build_output/*.apk
          retention-days: 14

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag_name }}
          name: "Release ${{ steps.version_info.outputs.tag_name }} (v${{ steps.version_info.outputs.version_name }})"
          body: |
            ### 🎵 Mise à jour MusicPro (${{ steps.version_info.outputs.tag_name }})
            
            - **Version Name** : `${{ steps.version_info.outputs.version_name }}`
            - **Version Code** : `${{ steps.version_info.outputs.version_code }}`
            - **Commit** : `${{ github.sha }}`
            - **Date** : ${{ github.event.head_commit.timestamp || 'Auto Build' }}
            
            *Cet APK est signé avec votre clé de production permanente (compatible mise à jour sans réinstallation).*
          files: build_output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

