name: CI - Tests & Lint

on:
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: musicpro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon -Djava.awt.headless=true

      - name: Run lint
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          ./gradlew :app:lintDebug --no-daemon -Djava.awt.headless=true
