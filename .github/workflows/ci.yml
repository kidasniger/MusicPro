name: CI - Tests & Lint

on:
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: musicpro-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Cache Robolectric android-all
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-v1

      - name: Pré-télécharger les jars Robolectric (relances + miroir de secours)
        run: |
          M2="$HOME/.m2/repository/org/robolectric/android-all-instrumented"
          fetch() {
            rel="$1"
            out="$M2/$rel"
            if [ -s "$out" ]; then echo "deja present: $rel"; return 0; fi
            mkdir -p "$(dirname "$out")"
            for base in "https://repo1.maven.org/maven2" "https://maven.aliyun.com/repository/public"; do
              if curl -fsSL --retry 4 --retry-all-errors --retry-delay 5 --connect-timeout 20 -o "$out.part" "$base/org/robolectric/android-all-instrumented/$rel"; then
                mv "$out.part" "$out"
                echo "telecharge: $rel"
                return 0
              fi
            done
            echo "ECHEC du pre-telechargement: $rel"
            return 1
          }
          fetch "14-robolectric-10818077-i7/android-all-instrumented-14-robolectric-10818077-i7.pom"
          fetch "14-robolectric-10818077-i7/android-all-instrumented-14-robolectric-10818077-i7.jar"
          fetch "16-robolectric-13921718-i7/android-all-instrumented-16-robolectric-13921718-i7.pom"
          fetch "16-robolectric-13921718-i7/android-all-instrumented-16-robolectric-13921718-i7.jar"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Verify Gradle Wrapper
        run: |
          chmod +x ./gradlew
          ./gradlew --version

      - name: Run unit tests
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          ./gradlew :app:testDebugUnitTest --no-daemon -Djava.awt.headless=true

      - name: Run lint
        env:
          GRADLE_OPTS: "-Djava.awt.headless=true -Xmx4g"
        run: |
          ./gradlew :app:lintDebug --no-daemon -Djava.awt.headless=true
